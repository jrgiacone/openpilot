name: Mirror mvl-boston sp-honda-dev-202608 + MPC lead toggle
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: {}

jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sp-honda-dev-202608-mpc-toggle
          fetch-depth: 0

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add mvl https://github.com/mvl-boston/openpilot.git || true
          git fetch mvl sp-honda-dev-202608
      - id: rebase
        run: |
          if git rebase mvl/sp-honda-dev-202608; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rebase.outputs.success == 'true'
        env:
          GIT_LFS_SKIP_PUSH: "1"
        run: git push origin sp-honda-dev-202608-mpc-toggle --force-with-lease

      - if: steps.rebase.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'sp-honda-dev-202608-mpc-toggle rebase conflict',
              body: 'Auto-rebase onto mvl-boston/openpilot sp-honda-dev-202608 failed — the MpcLeadTrajectory toggle commit (long_mpc.py / longitudinal_planner.py / both developer.py layouts / params_keys.h / log.capnp) conflicts with an upstream change. Resolve manually: cd into the sp-honda-dev-202608-mpc-toggle worktree, git fetch mvl sp-honda-dev-202608, git rebase mvl/sp-honda-dev-202608, resolve, git push --force-with-lease.'
            })
